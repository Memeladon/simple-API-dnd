services:

  backend:
    build: ./backend
    command: go run ./main.go
    container_name: backend-server
    ports:
      - "5000:5000"
    restart: always
    env_file:
      - backend/.env
    volumes:
      - db-data:/etc/data
    networks:
      - app-network

  mongodb:
    container_name: mongoDB
    image: mongo
    restart: always
    env_file:
      - backend/src/database/mongo/mongo.env
    volumes:
      - mongo_data:/var/lib/mongodb/data
    networks:
      - app-network

  postgres:
    container_name: postgreSQL
    image: postgres:17-alpine
    restart: always
    ports:
      - "5435:5435"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - backend/src/database/postgres/postgres.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:

volumes:
  mongo_data:
  postgres_data:
